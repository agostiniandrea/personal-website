name: Cloudflare Staging Deploy

# Deploys the `dev` branch to the staging Worker (dev.agostiniandrea.dev) on
# every push, so what is merged into `dev` can be checked on the real Workers
# runtime before a release. Production is deployed by `Cloudflare Deploy`.
# A merge made by the `Auto-merge` job (GITHUB_TOKEN) does not fire `push`
# workflows, so that job starts this workflow with `workflow_dispatch` instead.

on:
  push:
    branches: [dev]
  workflow_dispatch:

# One staging deploy at a time. A newer run waits instead of cancelling a
# running deploy halfway through.
concurrency:
  group: cloudflare-staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      NEXT_PUBLIC_SITE_URL: https://dev.agostiniandrea.dev
      SITE_URL: https://dev.agostiniandrea.dev
      # No analytics or Prolific variables on purpose: staging must not send
      # data to GA4 or Clarity, and the study return link only exists in
      # production.

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Same reason as in the production workflow: next-sitemap needs the
      # `.next` manifests, and the generated files are gitignored.
      - name: Generate sitemap and robots.txt
        run: |
          yarn build:compile
          yarn build:sitemap

      # The deploy command builds with the `staging` mode itself, which is what
      # selects the staging Worker name and domain in cloudflare.config.ts.
      - name: Deploy to Cloudflare staging
        run: yarn deploy:vinext --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
