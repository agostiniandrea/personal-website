name: Cloudflare Deploy

# Rebuilds the site and deploys the Worker. Replaces the Vercel deploy hook for
# content changes: Contentful calls the `repository_dispatch` endpoint on
# Entry.publish / Entry.unpublish, and a weekly run keeps everything fresh.
# repository_dispatch and schedule always run on the default branch; a manual
# run from another branch is allowed for testing the workflow itself.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [contentful-publish]
  schedule:
    - cron: "30 3 * * 1" # At 03:30 UTC every Monday

# One deploy at a time. A newer run waits instead of cancelling a running
# deploy halfway through.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
      NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
      NEXT_PUBLIC_SITE_URL: https://agostiniandrea.dev
      SITE_URL: https://agostiniandrea.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # next-sitemap reads the `.next` build manifests, which Vite does not
      # produce. public/sitemap.xml and public/robots.txt are gitignored, so
      # they have to be generated here or the Worker would serve a 404 for both.
      - name: Generate sitemap and robots.txt
        run: |
          yarn build:compile
          yarn build:sitemap

      - name: Build
        run: yarn build:vinext

      - name: Deploy to Cloudflare
        run: yarn deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
