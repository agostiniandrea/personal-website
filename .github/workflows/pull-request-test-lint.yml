name: Test & Lint

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: read
  # To start the deploy workflows after the auto-merge (see the last step).
  actions: write

jobs:
  test-and-lint:
    name: Tests & Lint
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.actor, 'dependabot') }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Type-check TypeScript
        run: yarn build:config

      - name: Run tests
        run: yarn test

      - name: Run lint
        run: yarn lint

      - name: Build for Lighthouse
        run: yarn build:compile
        env:
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI (desktop)
        run: |
          yarn start &
          npx wait-on http://localhost:3000 --timeout 30000
          yarn lhci

      - name: Run Lighthouse CI (mobile)
        run: npx lhci autorun --config=.lighthouserc.mobile.json

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.actor, 'dependabot') }}
    # The official image ships Chromium and every system library it needs, so
    # nothing is installed at run time. `playwright install --with-deps` used to
    # do that here, and its apt phase is where the runs went to die: when the
    # Azure Ubuntu mirror is unreachable, apt retries each index on a long
    # timeout before falling back to the public archive. One run spent 36
    # minutes in that loop. Keep this tag in step with @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # The image carries an older Node than this project's engines field
      # allows, so the toolchain still comes from setup-node.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      # Playwright's own webServer is disabled under CI, and the server used to
      # come from the Lighthouse step in the single job this was split out of.
      # In its own job it has to build and serve for itself.
      - name: Build
        run: yarn build:compile
        env:
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run E2E tests
        run: |
          yarn start &
          npx wait-on http://localhost:3000 --timeout 60000
          yarn e2e
        env:
          CI: true

  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    needs: [test-and-lint, e2e]
    if: ${{ success() && !startsWith(github.actor, 'dependabot') }}

    steps:
      # `dev` is a long-lived branch: the release PR (dev -> main) must never
      # delete its own source branch when it merges. It is also merged with a
      # merge commit, not a squash: a squash would rewrite `dev`'s commits into
      # a new one on `main`, and `dev` would then have to be rebased and
      # force-pushed after every release. With a merge commit `main` contains
      # `dev`'s commits as they are, so the two branches never diverge.
      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "dev" ]; then
            gh pr merge --merge --auto "$PR_NUMBER" --repo "$REPO"
          else
            gh pr merge --squash --delete-branch --auto "$PR_NUMBER" --repo "$REPO"
          fi

      # A merge made with GITHUB_TOKEN does not fire `push` workflows (GitHub
      # blocks it to avoid loops), so the deploy that normally follows a merge
      # into `dev` or `main` would never start. `workflow_dispatch` is the one
      # event GITHUB_TOKEN is allowed to trigger, so start the deploy here.
      - name: Deploy after the merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPO: ${{ github.repository }}
        run: |
          state=""
          for _ in $(seq 1 36); do
            state=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)
            [ "$state" = "MERGED" ] && break
            sleep 10
          done

          if [ "$state" != "MERGED" ]; then
            echo "PR #$PR_NUMBER is not merged yet: no deploy started. Run it by hand if needed."
            exit 0
          fi

          case "$BASE_REF" in
            dev)
              gh workflow run cloudflare-staging-deploy.yml --ref dev --repo "$REPO"
              ;;
            main)
              gh workflow run cloudflare-deploy.yml --ref main --repo "$REPO"
              ;;
            *)
              echo "Base branch $BASE_REF has no deploy."
              ;;
          esac
